aid: mendral
name: Mendral
description: Mendral, Inc. is the AI DevOps Engineer — three always-on agents for security,
  reliability, and performance, plus custom automations for any DevOps work specific to
  your stack. Built by the team behind Docker and Dagger (founders Sam Alba and Andrea
  Luzzardi), Mendral installs as a GitHub App and reads your CI/CD logs to review dependency
  PRs, pin safe package versions, surface exploitable CVEs, diagnose CI failures, fix flaky
  tests, and cut build times. It integrates with GitHub Actions, AWS, Google Cloud, Datadog,
  and Sentry, and ships a command-line client for browsing and triaging insights from the
  terminal or a coding agent. Y Combinator Winter 2026; based in San Francisco.
